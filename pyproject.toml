[project]
name = "cs341-lab2-kit"
version = "0.1.0"
description = "CS341 Lab 2 SDN filtering kit (Mininet + OVS + os-ken, OpenFlow 1.3)"
requires-python = ">=3.10"
dependencies = [
    "os-ken==4.2.2",
    "pyyaml>=6",
    "packaging>=20.4",
    # Python module only; mnexec / mn come from the Ubuntu `mininet` package.
    # 2.3.0 imports distutils (removed in Python 3.12); 2.3.1b4 uses packaging.
    "mininet @ git+https://github.com/mininet/mininet@2.3.1b4",
]

[project.scripts]
# os-ken >= 4.0 dropped its CLI; the kit ships a compatible one.
osken-manager = "kit.controller.launcher:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
